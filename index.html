<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <title>Dart Autoscorer + Kamera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --bg:#121212;
      --fg:#eee;
      --card:#1e1e1e;
      --primary:#0d6efd;
      --danger:#dc3545;
    }
    body.light{
      --bg:#ffffff;
      --fg:#212529;
      --card:#f8f9fa;
    }
    body{background:var(--bg);color:var(--fg);font-family:system-ui}
    .score-box{font-size:3.5rem;font-weight:700}
    .btn-num{width:70px;height:70px;margin:5px;font-size:1.4rem}
    .btn-bull{width:150px}
    .history{max-height:160px;overflow-y:auto;font-size:.9rem}
    .stat{font-size:1.1rem}
    #video{width:100%;max-width:400px;border-radius:8px}
    #canvas{display:none}
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
<!-- ========= HEADER ========= -->
<header class="py-3 border-bottom">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="m-0">Dart Autoscorer</h1>
    <div>
      <button class="btn btn-sm btn-outline-secondary me-2" onclick="toggleDarkLight()">🌗</button>
      <button class="btn btn-sm btn-outline-light" onclick="resetGame()">Neues Spiel</button>
      <button class="btn btn-sm btn-outline-warning" onclick="undo()">Rückgängig</button>
    </div>
  </div>
</header>

<!-- ========= MAIN ========= -->
<main class="container flex-grow-1 py-4">
  <!-- Einstellungen -->
  <section class="row g-3 mb-4">
    <div class="col-md-3">
      <label class="form-label">Modus</label>
      <select id="mode" class="form-select">
        <option value="301">301</option>
        <option value="501" selected>501</option>
        <option value="701">701</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Out</label>
      <select id="out" class="form-select">
        <option value="straight">Straight</option>
        <option value="double">Double</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Spieler</label>
      <select id="players" class="form-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>
    <div class="col-md-3 d-flex align-items-end">
      <button class="btn btn-primary w-100" onclick="applySettings()">Übernehmen</button>
    </div>
  </section>

  <!-- Score-Board -->
  <section id="scoreBoard" class="row g-3 mb-4"></section>

  <!-- Kamera-Bereich -->
  <section class="mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-lg-6">
        <h5>Kamera-Erkennung</h5>
        <video id="video" autoplay playsinline></video>
        <br>
        <button id="btnCam" class="btn btn-sm btn-primary" onclick="toggleCamera()">Kamera starten</button>
        <span id="camStatus" class="ms-2 small">Bereit</span>
      </div>
      <div class="col-lg-6">
        <h6>Letzte Erkennung</h6>
        <div id="lastHit" class="small">–</div>
        <h6 class="mt-3">Checkout-Vorschlag</h6>
        <div id="checkoutHint" class="small">–</div>
      </div>
    </div>
  </section>

  <!-- Manuelle Eingabe (Fallback) -->
  <section class="row g-3">
    <div class="col-lg-6">
      <h6>Manuelle Eingabe (Fallback)</h6>
      <div class="d-flex flex-wrap justify-content-center">
        <template id="tplNum">
          <button class="btn btn-outline-primary btn-num"></button>
        </template>
      </div>
      <div class="w-100 text-center mt-3">
        <button class="btn btn-outline-danger btn-bull" onclick="addScore(50)">Bull 50</button>
        <button class="btn btn-outline-secondary btn-bull" onclick="addScore(25)">Outer 25</button>
        <button class="btn btn-outline-dark btn-bull" onclick="addScore(0)">Miss 0</button>
      </div>
    </div>
    <!-- Statistiken -->
    <div class="col-lg-6">
      <h5>Statistik <span id="curP"></span></h5>
      <div class="stat">Average: <span id="avg">0.00</span></div>
      <div class="stat">Darts: <span id="darts">0</span></div>
      <div class="stat">First 9: <span id="first9">–</span></div>
      <div class="stat">Doppel-Quote: <span id="doppQuote">–</span></div>
    </div>
  </section>
</main>

<!-- ========= SCRIPTS ========= -->
<script>
/* ===================================================================
 *  ZUSTAND
 * ===================================================================*/
const STORAGE_KEY = 'dartscorer_v2';
let state = loadState();
let undoStack = [];

/* ===================================================================
 *  DARK / LIGHT
 * ===================================================================*/
function toggleDarkLight(){
  document.body.classList.toggle('light');
  localStorage.setItem('darkLight', document.body.classList.contains('light')?'light':'dark');
}
(function(){
  const saved = localStorage.getItem('darkLight')||'dark';
  if(saved==='light') document.body.classList.add('light');
})();

/* ===================================================================
 *  INIT
 * ===================================================================*/
window.addEventListener('DOMContentLoaded', ()=>{
  renderNumbers();
  renderScoreBoard();
  renderStats();
  saveState();
});

/* ===================================================================
 *  EINSTELLUNGEN
 * ===================================================================*/
function applySettings(){
  const mode   = parseInt(document.getElementById('mode').value);
  const out    = document.getElementById('out').value;
  const players= parseInt(document.getElementById('players').value);
  if(state.players.length !== players || state.mode !== mode || state.out !== out){
    if(!confirm('Neues Spiel starten?')) return;
    initFreshGame(mode, out, players);
  }
}
function initFreshGame(mode, out, players){
  state = {
    mode, out,
    players: Array.from({length:players},(_,i)=>({
      name:`Spieler ${i+1}`,
      score: mode,
      legs:0, sets:0,
      visits:[], darts:0,
      doubleAttempts:0, doubleHits:0
    })),
    current:0, round:[], gameOver:false
  };
  undoStack=[];
  renderScoreBoard(); renderStats(); saveState();
}

/* ===================================================================
 *  SCORE-BOARD
 * ===================================================================*/
function renderScoreBoard(){
  const board = document.getElementById('scoreBoard');
  board.innerHTML='';
  state.players.forEach((p,i)=>{
    const div = document.createElement('div'); div.className='col-6 col-md-3';
    div.innerHTML=`
      <div class="card ${i===state.current?'border-warning':''}" style="background:var(--card)">
        <div class="card-body text-center">
          <h6 class="card-title">${p.name}</h6>
          <div class="score-box">${p.score}</div>
          <div class="small">Legs: ${p.legs}</div>
          <div class="history mt-2">${p.visits.map(v=>v.join(', ')).join(' | ')}</div>
        </div>
      </div>`;
    board.appendChild(div);
  });
}

/* ===================================================================
 *  MANUELLE EINGABE
 * ===================================================================*/
function renderNumbers(){
  const wrap = document.querySelector('.d-flex.flex-wrap.justify-content-center');
  const tpl  = document.getElementById('tplNum');
  for(let n=1;n<=20;n++){
    ['single','double','triple'].forEach(type=>{
      const btn = tpl.content.cloneNode(true).querySelector('button');
      const mult = type==='single'?1:type==='double'?2:3;
      btn.textContent = type.charAt(0).toUpperCase()+type.slice(1)+' '+n;
      btn.onclick = ()=> addScore(n*mult);
      wrap.appendChild(btn);
    });
  }
}

/* ===================================================================
 *  SCORE LOGIK
 * ===================================================================*/
function addScore(val){
  if(state.gameOver) return;
  undoStack.push(JSON.stringify(state));
  state.round.push(val);
  speak(`Dart ${state.round.length}: ${val}`);
  showLastHit(val);
  suggestCheckout();          // nach JEDEM Dart neu
  if(state.round.length===3){
    const sum = state.round.reduce((a,b)=>a+b,0);
    const p   = state.players[state.current];
    p.visits.push([...state.round]);
    p.darts += 3;
    p.score -= sum;
    if(p.score===0 && isValidOut(sum)){
      p.legs++; p.doubleHits++;
      speak(`${p.name} legt aus!`); alert(`${p.name} legt aus!`);
      resetLeg();
    }else if(p.score<0 || (p.score===0 && !isValidOut(sum))){
      p.score += sum; alert('Überworfen / Ungültiger Out');
    }else{
      nextPlayer();
    }
    state.round=[];
  }
  renderScoreBoard(); renderStats(); saveState();
}
function isValidOut(sum){
  return state.out==='straight' || (state.out==='double' && state.round[state.round.length-1]%2===0 && state.round[state.round.length-1]!==0);
}
function nextPlayer(){ state.current = (state.current+1)%state.players.length; }
function resetLeg(){
  state.players.forEach(p=>p.score=state.mode);
  state.current=0; state.round=[]; state.gameOver=false;
}

/* ===================================================================
 *  STATS
 * ===================================================================*/
function renderStats(){
  const p = state.players[state.current];
  document.getElementById('curP').textContent = p.name;
  const total = state.mode - p.score;
  const darts = p.darts + state.round.length;
  const avg = darts? (total/darts*3).toFixed(2) : '0.00';
  document.getElementById('avg').textContent = avg;
  document.getElementById('darts').textContent = darts;
  const first9 = p.visits.slice(0,3).flat();
  const first9Avg = first9.length ? (first9.reduce((a,b)=>a+b,0)/first9.length*3).toFixed(2) : '–';
  document.getElementById('first9').textContent = first9Avg;
  const dq = p.doubleAttempts ? (p.doubleHits/p.doubleAttempts*100).toFixed(1)+'%' : '–';
  document.getElementById('doppQuote').textContent = dq;
}

/* ===================================================================
 *  CHECKOUT VORSCHLAG
 * ===================================================================*/
function suggestCheckout(){
  const p = state.players[state.current];
  const r = state.round.length;
  const remaining = p.score;
  if(remaining>170||remaining<=1){ document.getElementById('checkoutHint').textContent='–'; return; }
  // beste Route für verbleibende Punkte
  const route = getCheckoutRoute(remaining);
  document.getElementById('checkoutHint').textContent = route || 'Keine Standard-Route';
}
/*  simplest Lookup – erweiterbar bis 170 */
function getCheckoutRoute(n){
  const tbl={
    170:'T20 T20 Bull',
    167:'T20 T19 Bull',
    164:'T20 T18 Bull',
    161:'T20 T17 Bull',
    160:'T20 T20 D20',
    158:'T20 T20 D19',
    157:'T19 T20 D20',
    156:'T20 T20 D18',
    150:'T20 T18 D18',
    130:'T20 T20 D5',
    121:'T20 T11 D14',
    100:'T20 D20',
    98:'T20 D19',
    96:'T20 D18',
    80:'T20 D10',
    60:'T20 D0',
    40:'D20'
  };
  return tbl[n];
}

/* ===================================================================
 *  RÜCKGÄNGIG / NEUES SPIEL
 * ===================================================================*/
function undo(){
  if(!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  renderScoreBoard(); renderStats(); saveState();
}
function resetGame(){
  if(!confirm('Neues Spiel?')) return;
  initFreshGame(
    parseInt(document.getElementById('mode').value),
    document.getElementById('out').value,
    parseInt(document.getElementById('players').value)
  );
}

/* ===================================================================
 *  LOCALSTORAGE
 * ===================================================================*/
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ const s=JSON.parse(raw); if(!s.players) throw 'old'; return s; }catch{ localStorage.removeItem(STORAGE_KEY); } }
  return {
    mode:501, out:'double',
    players:[ {name:'Spieler 1',score:501,legs:0,sets:0,visits:[],darts:0,doubleAttempts:0,doubleHits:0} ],
    current:0, round:[], gameOver:false
  };
}

/* ===================================================================
 *  SPRACHAUSGABE
 * ===================================================================*/
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang='de-DE'; utter.rate=1.1;
  speechSynthesis.cancel(); speechSynthesis.speak(utter);
}

/* ===================================================================
 *  KAMERA-ERKENNUNG
 * ===================================================================*/
let stream;
let video, canvas, ctx;
function toggleCamera(){
  video  = document.getElementById('video');
  canvas = document.createElement('canvas');
  ctx    = canvas.getContext('2d');
  const btn = document.getElementById('btnCam');
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null; video.srcObject=null;
    btn.textContent='Kamera starten';
    document.getElementById('camStatus').textContent='Bereit';
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(s=>{
      stream=s; video.srcObject=s;
      btn.textContent='Kamera stoppen';
      document.getElementById('camStatus').textContent='Erkenne …';
      startDetection();
    })
    .catch(e=>{ alert('Kamera-Zugriff verweigert'); console.error(e); });
}
/* sehr simple Farb-Erkennung –  JUST 4 FUN */
function startDetection(){
  const W=video.videoWidth||640;
  const H=video.videoHeight||480;
  canvas.width=W; canvas.height=H;
  let lastHits=[]; // 3 Darts
  const detect=()=>{
    if(!stream) return;
    ctx.drawImage(video,0,0,W,H);
    const img=ctx.getImageData(0,0,W,H);
    const reds=[]; // Pixel mit viel Rot-Anteil
    for(let i=0;i<img.data.length;i+=4){
      const r=img.data[i], g=img.data[i+1], b=img.data[i+2];
      if(r>150 && g<100 && b<100) reds.push({x:(i/4)%W,y:Math.floor((i/4)/W)});
    }
    // wenn wir ~30 rote Pixel haben, nehmen wir an, Dart steckt
    if(reds.length>30){
      const mx = reds.reduce((a,b)=>a+b.x,0)/reds.length;
      const my = reds.reduce((a,b)=>a+b.y,0)/reds.length;
      const sector = pixelToSector(mx,my,W,H);
      if(sector){
        lastHits.push(sector);
        speak('Erkannt: '+sector);
        showLastHit(sector);
        if(lastHits.length===3){
          lastHits.forEach(h=>addScore(h));
          lastHits=[];
        }
      }
    }
    requestAnimationFrame(detect);
  };
  detect();
}
/* vereinfachte Segment-Berechnung – Bull + 20 Segmente */
function pixelToSector(x,y,W,H){
  const cx=W/2, cy=H/2;
  const dx=x-cx, dy=y-cy;
  const r=Math.hypot(dx,dy);
  if(r<30) return 50;                       // Bull
  if(r<50) return 25;                       // Outer
  const angle=(Math.atan2(dy,dx)+Math.PI*2.5)%(Math.PI*2); // 0 oben
  const seg=Math.floor(angle/(Math.PI*2/20));
  const field=[6,13,4,18,1,20,5,12,9,14,11,8,16,7,19,3,17,2,15,10][seg];
  const ring = r<150 ? 'single' : r<220 ? 'triple' : r<300 ? 'single' : 'double';
  const mult = ring==='single'?1:ring==='double'?2:3;
  return field*mult;
}
function showLastHit(val){
  document.getElementById('lastHit').textContent = val;
}
</script>
</body>
</html>
