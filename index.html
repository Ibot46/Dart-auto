<!DOCTYPE html><html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dart Scorer Pro (Voice)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; }
    button { padding:10px 16px; margin:6px; font-size:16px; }
    .throw { margin:4px; }
  </style>
</head>
<body><h1>🎯 Dart Scorer Pro</h1><button onclick="toggleVoice()">🎤 Sprache AN / AUS</button> <button onclick="finishTurn()">➡️ Zug beenden</button>

<h2 id="status">Sprache: AUS</h2>
<div id="throws"></div><script>
let state = {
  currentThrow: [],
  inputMode: 'single'
};

let recognition;
let voiceActive = false;
let lastMode = 'single'; // merkt sich Triple / Double

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window)) {
    alert('Nur in Chrome / Android Chrome verfügbar');
    return;
  }

  if (voiceActive) {
    recognition.stop();
    voiceActive = false;
    document.getElementById('status').innerText = 'Sprache: AUS';
    return;
  }

  recognition = new webkitSpeechRecognition();
  recognition.lang = 'de-DE';
  recognition.continuous = true; // 🔥 dauerhaft
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const text = event.results[event.results.length - 1][0].transcript.toLowerCase();
    console.log('🎤', text);
    parseVoice(text);
  };

  recognition.onend = () => {
    if (voiceActive) recognition.start(); // 🔁 sofort neu starten
  };

  recognition.start();
  voiceActive = true;
  document.getElementById('status').innerText = 'Sprache: AN (einfach Zahl sagen)';
}

function parseVoice(text) {
  if (state.currentThrow.length >= 3) return;

  if (text.includes('triple')) {
    lastMode = 'triple';
    speak('Triple');
    return;
  }

  if (text.includes('double')) {
    lastMode = 'double';
    speak('Double');
    return;
  }

  if (text.includes('bull')) {
    addThrow(50, 'Bull');
    lastMode = 'single';
    return;
  }

  const num = extractNumber(text);
  if (!num) return;

  let score = num;
  let label = num;

  if (lastMode === 'triple') {
    score = num * 3;
    label = 'Triple ' + num;
  } else if (lastMode === 'double') {
    score = num * 2;
    label = 'Double ' + num;
  }

  addThrow(score, label);
  lastMode = 'single'; // 🔁 zurücksetzen
}

function extractNumber(text) {
  const match = text.match(/\d+/);
  if (!match) return null;
  const n = parseInt(match[0]);
  return n >= 0 && n <= 20 ? n : null;
}

function addThrow(score, label) {
  if (state.currentThrow.length >= 3) return;

  state.currentThrow.push({ score, label });
  const div = document.createElement('div');
  div.className = 'throw';
  div.innerText = '🎯 ' + label + ' = ' + score;
  document.getElementById('throws').appendChild(div);
}

function finishTurn() {
  state.currentThrow = [];
  document.getElementById('throws').innerHTML = '';
  speak('Nächster Zug');
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  speechSynthesis.speak(u);
}
</script></body>
</html>
