<!DOCTYPE html><html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dart Scorer Pro (Voice)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; }
    button { padding:10px 16px; margin:6px; font-size:16px; }
    .throw { margin:4px; }
  </style>
</head>
<body><h1>🎯 Dart Scorer Pro</h1><button onclick="toggleVoice()">🎤 Sprache AN / AUS</button> <button onclick="finishTurn()">➡️ Zug beenden</button>

<h2 id="status">Sprache: AUS</h2>
<div id="throws"></div><script>
let recognition;
let speechActive = false;
let pendingMode = 'single';

function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert('Spracherkennung nur mit Chrome/Edge möglich');
    return;
  }

  recognition = new SR();
  recognition.lang = 'de-DE';
  recognition.interimResults = false;
  recognition.continuous = false; // wichtig für Mobile!

  recognition.onresult = (event) => {
    const text = event.results[event.results.length - 1][0].transcript
      .toLowerCase()
      .trim();
    handleSpeech(text);
  };

  recognition.onend = () => {
    // 🔥 DAS ist der entscheidende Fix
    if (speechActive) {
      setTimeout(() => {
        try {
          recognition.start();
        } catch (e) {}
      }, 100);
    }
  };

  recognition.onerror = () => {
    // Fehler ignorieren & neu starten
    if (speechActive) {
      try {
        recognition.stop();
      } catch {}
    }
  };
}

function startSpeech() {
  if (!recognition) initSpeech();
  speechActive = true;
  try {
    recognition.start();
  } catch {}
}

function stopSpeech() {
  speechActive = false;
  try {
    recognition.stop();
  } catch {}
}

function handleSpeech(text) {
  console.log('🎤', text);

  if (text.includes('triple')) {
    pendingMode = 'triple';
    speak('Triple');
    return;
  }

  if (text.includes('double')) {
    pendingMode = 'double';
    speak('Double');
    return;
  }

  if (text.includes('bull')) {
    addSpecial(50);
    pendingMode = 'single';
    return;
  }

  const num = parseInt(text.replace(/[^0-9]/g, ''));
  if (!isNaN(num) && num >= 0 && num <= 20) {
    state.inputMode = pendingMode;
    addThrow(num);
    pendingMode = 'single';
  }
}
</script></body>
</html>
